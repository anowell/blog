[versions]
androidGradlePlugin = "9.0.0"
activity = "1.10.1"
complicationsDataSource = "1.2.1"
coroutines = "1.10.2"
playServicesLocation = "21.3.0"

[libraries]
activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
complications-data-source = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "complicationsDataSource" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
